    - "United States (US)"
    - "United Kingdom (UK)"
    - "Canada (CA)"
    - "Australia (AU)"
  experience_level: "1 to 5 years independent operating experience"
  monthly_revenue_band_usd: "$2,000 to $8,000 per month"
  primary_segments:
    - "Independent Freelancers (UX/UI, Webflow, Full-Stack Dev, Copywriting, Design)"
    - "Solopreneurs & Fractional Specialists"
    - "Independent Management & Marketing Consultants"
    - "Executive Virtual Assistants & Operations Managers"
    - "Boutique Digital Service Providers"
  core_pain_points:
    - "35% to 40% of weekly working hours lost to unpaid administrative friction and inbox chaos"
    - "Severe Effective Hourly Rate (EHR) erosion caused by unbilled revisions and scope creep"
    - "Slow, custom-written project proposals taking 2 to 4 hours per lead with low conversion"
    - "Delayed project kickoffs caused by missing client credentials, assets, and scattered onboarding"
    - "Prompt-dump fatigue from generic AI prompt lists that lack operational context or quality gates"
    - "Over-engineered Notion workspaces that require more maintenance than actual billable client work"

