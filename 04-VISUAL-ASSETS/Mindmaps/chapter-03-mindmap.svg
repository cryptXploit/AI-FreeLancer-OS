  <rect x="24" y="352" width="428" height="114" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <rect x="24" y="352" width="428" height="30" rx="6" fill="#0F172A" />
  <text x="238" y="372" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">E — EXCLUSIONS &amp; ASSUMPTIONS</text>
  <text x="38" y="400" fill="#1E293B" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Lock 2-round consolidated revision allowance upfront</text>
  <text x="38" y="422" fill="#1E293B" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Define 48-hour client asset &amp; feedback turnaround duty</text>
  <text x="38" y="444" fill="#1E293B" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Attach explicit "What Is Not Included" &amp; Add-On Menu</text>

  <!-- F: Bottom Right -->
  <rect x="508" y="352" width="428" height="114" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" />
  <rect x="508" y="352" width="428" height="30" rx="6" fill="#0D9488" />
  <text x="722" y="372" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">F — FIXED TIMELINE &amp; NEXT STEP</text>
  <text x="522" y="400" fill="#1E293B" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Clear Milestone 1, Milestone 2 &amp; Handover dates</text>
  <text x="522" y="422" fill="#1E293B" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• 7-calendar-day proposal &amp; production slot validity window</text>
  <text x="522" y="444" fill="#1E293B" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• 1-click option selection + 50% deposit invoice trigger</text>

  <!-- Bottom KPI Bar -->
