  <text x="36" y="122" fill="#0F172A" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Restate client's exact problem in their words</text>
  <text x="36" y="144" fill="#0F172A" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Quantify current weekly cost of inaction</text>
  <text x="36" y="166" fill="#0F172A" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Prove immediate diagnostic comprehension</text>
  <text x="36" y="186" fill="#0284C7" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Section Length: 3 Crisp Sentences</text>

