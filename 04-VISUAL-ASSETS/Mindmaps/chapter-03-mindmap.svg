  <text x="480" y="508" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">TARGET OUTCOMES: Proposal Drafting Time: &lt;= 12 Mins | Unqualified Discovery Calls: -70% | Proposal Close Rate: +30-50% | Ghosting Rate: Cut in Half</text>
