  <text x="664" y="282" fill="#0F172A" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Option 2: Tier 2 Core Transformation</text>
  <text x="664" y="304" fill="#0F172A" font-size="10.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Option 3: Tier 3 Retainer Partner</text>
  <text x="664" y="324" fill="#0D9488" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Side-by-Side Self-Selection Table</text>

