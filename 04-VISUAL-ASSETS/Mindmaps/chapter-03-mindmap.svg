  <!-- Connectors from Central Hub to 5 B.R.I.E.F. Nodes -->
  <path d="M 335 242 L 288 155" stroke="#0284C7" stroke-width="2.5" fill="none" marker-end="url(#ch3-arrow-blue)" />
