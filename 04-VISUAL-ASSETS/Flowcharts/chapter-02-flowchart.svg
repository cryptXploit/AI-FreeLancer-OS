<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <marker id="ch2-fc-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="ch2-fc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="ch2-fc-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8" />

  <!-- Top Header Banner -->
  <rect x="20" y="14" width="920" height="42" rx="6" fill="#0F172A" />
  <text x="480" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">CHAPTER 2 DECISION FLOWCHART: HOURLY VS. PRODUCTIZED OFFER QUALIFICATION</text>

  <!-- Start Node -->
  <rect x="270" y="68" width="420" height="40" rx="20" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
  <text x="480" y="93" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">FREELANCE SERVICE OR CLIENT INQUIRY EVALUATED</text>
  <path d="M 480 108 L 480 132" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-navy)" />

  <!-- Gate 1 -->
  <rect x="210" y="134" width="540" height="50" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
  <text x="480" y="154" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 1: REPEATABILITY &amp; OUTCOME AUDIT</text>
  <text x="480" y="173" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Does the work have a repeatable outcome &amp; predictable steps (80% similar)?</text>

  <!-- Gate 1 NO -> Action A (Left) -->
  <path d="M 210 159 L 125 159 L 125 362" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-navy)" />
  <rect x="38" y="210" width="174" height="24" rx="4" fill="#0F172A" />
  <text x="125" y="226" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (Experimental / R&amp;D)</text>

  <!-- Gate 1 YES -> Gate 2 -->
  <path d="M 550 184 L 580 212" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-teal)" />
  <rect x="570" y="187" width="160" height="22" rx="4" fill="#0D9488" />
  <text x="650" y="202" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (Repeatable Craft)</text>

  <!-- Gate 2 -->
  <rect x="330" y="214" width="520" height="48" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
  <text x="590" y="233" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 2: INPUT &amp; ASSET READINESS CHECK</text>
  <text x="590" y="251" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Can the client provide required inputs/assets before kickoff?</text>

  <!-- Gate 2 NO -> Action B -->
  <path d="M 380 262 L 360 362" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-navy)" />
  <rect x="282" y="294" width="144" height="22" rx="4" fill="#0F172A" />
  <text x="354" y="309" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (Missing Inputs)</text>

  <!-- Gate 2 YES -> Gate 3 -->
  <path d="M 670 262 L 690 288" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-teal)" />
  <rect x="695" y="265" width="130" height="20" rx="4" fill="#0D9488" />
  <text x="760" y="279" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (Inputs Ready)</text>

  <!-- Gate 3 -->
  <rect x="480" y="290" width="456" height="46" rx="8" fill="#0D9488" stroke="#0F172A" stroke-width="1.5" />
  <text x="708" y="308" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 3: ENGAGEMENT CADENCE SELECTION</text>
  <text x="708" y="326" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Does the client need one-time execution or ongoing monthly iteration?</text>

  <!-- Gate 3 Branches to Action C and Action D -->
  <path d="M 600 336 L 595 362" stroke="#0284C7" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-blue)" />
  <path d="M 830 336 L 830 362" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch2-fc-teal)" />

  <!-- ACTION A (Col 1) -->
  <rect x="20" y="366" width="215" height="126" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <rect x="20" y="366" width="215" height="28" rx="6" fill="#0F172A" />
  <text x="127" y="384" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION A — Paid Audit First</text>
  <text x="30" y="408" fill="#0284C7" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Sell Tier 1 Diagnostic ($250-$750):</text>
  <text x="30" y="428" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Paid 5-7 day discovery sprint</text>
  <text x="30" y="448" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Define exact architecture &amp; scope</text>
  <text x="30" y="468" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Never quote blind fixed fees</text>

  <!-- ACTION B (Col 2) -->
  <rect x="250" y="366" width="215" height="126" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
  <rect x="250" y="366" width="215" height="28" rx="6" fill="#0284C7" />
  <text x="357" y="384" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION B — Prep Add-On Gate</text>
  <text x="260" y="408" fill="#0F172A" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Bundle Asset &amp; Strategy Add-On:</text>
  <text x="260" y="428" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Charge paid Asset Prep Sprint</text>
  <text x="260" y="448" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Or hold kickoff until Gate 3 met</text>
  <text x="260" y="468" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Protect delivery timeline clock</text>

  <!-- ACTION C (Col 3) -->
  <rect x="480" y="366" width="225" height="126" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
  <rect x="480" y="366" width="225" height="28" rx="6" fill="#0284C7" />
  <text x="592" y="384" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION C — One-Time Execution</text>
  <text x="490" y="408" fill="#0284C7" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Pitch Tier 2 Core Transformation:</text>
  <text x="490" y="428" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Fixed-scope flagship sprint</text>
  <text x="490" y="448" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Show Tier 1 &amp; Tier 3 as anchors</text>
  <text x="490" y="468" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Lock 2-round revision cap</text>

  <!-- ACTION D (Col 4) -->
  <rect x="720" y="366" width="220" height="126" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" />
  <rect x="720" y="366" width="220" height="28" rx="6" fill="#0D9488" />
  <text x="830" y="384" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION D — Ongoing Iteration</text>
  <text x="730" y="408" fill="#0D9488" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Pitch Tier 3 Retainer Partner:</text>
  <text x="730" y="428" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Fixed monthly recurring fee</text>
  <text x="730" y="448" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Hard monthly deliverable cap</text>
  <text x="730" y="468" fill="#1E293B" font-size="9.5" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">• Zero unused-hour rollover rule</text>

  <!-- Bottom Banner -->
  <rect x="20" y="504" width="920" height="40" rx="6" fill="#0F172A" stroke="#0D9488" stroke-width="1.5" />
  <text x="480" y="529" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">COMMERCIAL RULE: Never quote open-ended hourly labor. Every inquiry exits as Tier 1 Audit, Tier 2 Sprint, or Tier 3 Retainer.</text>
</svg>
