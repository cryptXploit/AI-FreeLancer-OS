<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <marker id="ch3-fc-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="ch3-fc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="ch3-fc-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8" />

  <!-- Top Header Banner -->
  <rect x="20" y="14" width="920" height="42" rx="6" fill="#0F172A" />
  <text x="480" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">CHAPTER 3 DECISION FLOWCHART: LEAD RED-FLAG &amp; GO/NO-GO TRIAGE</text>

  <!-- Start Node -->
  <rect x="300" y="68" width="360" height="40" rx="20" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
  <text x="480" y="93" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NEW INBOUND LEAD OR RFP RECEIVED</text>
  <path d="M 480 108 L 480 132" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch3-fc-navy)" />

  <!-- Gate 1 (Async Pre-Screen) -->
  <rect x="190" y="134" width="580" height="52" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
  <text x="480" y="154" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 1: ASYNC PRE-SCREEN GATE</text>
  <text x="480" y="173" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Did prospect complete the 4-Question Pre-Call Intake Form (Budget, Timeline, Goal, Decision-Maker)?</text>

  <!-- Gate 1 NO -> Action A (Left) -->
  <path d="M 190 160 L 155 160 L 155 348" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch3-fc-navy)" />
  <rect x="65" y="218" width="180" height="24" rx="4" fill="#0F172A" />
  <text x="155" y="234" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO / Refuses Intake Form</text>

  <!-- Gate 1 YES -> Gate 2 -->
  <path d="M 550 186 L 590 218" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch3-fc-teal)" />
  <rect x="575" y="190" width="146" height="22" rx="4" fill="#0D9488" />
  <text x="648" y="205" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (Form Submitted)</text>

  <!-- Gate 2 (Budget & Red-Flag Check) -->
  <rect x="310" y="220" width="626" height="56" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
  <text x="623" y="242" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 2: BUDGET FLOOR &amp; TOXIC RED-FLAG FILTER</text>
  <text x="623" y="261" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Is budget &gt;= 80% of Tier 1 minimum AND free of red flags ("exposure", "free test", "urgent tomorrow")?</text>

  <!-- Gate 2 NO -> Action B (Middle) -->
  <path d="M 480 276 L 480 348" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch3-fc-navy)" />
  <rect x="385" y="298" width="190" height="24" rx="4" fill="#0F172A" />
  <text x="480" y="314" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (Below Floor / Red Flag)</text>

  <!-- Gate 2 YES -> Gate 3 (Right) -->
  <path d="M 790 276 L 795 294" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch3-fc-teal)" />

  <!-- Gate 3 Box -->
  <rect x="650" y="296" width="286" height="38" rx="6" fill="#0D9488" />
  <text x="793" y="313" text-anchor="middle" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (Qualified Lead) -&gt; GATE 3:</text>
  <text x="793" y="328" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">Run 20-Min Call &amp; Execute Prompts 3.1 + 3.3</text>
  <path d="M 793 334 L 793 348" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch3-fc-teal)" />

  <!-- ACTION A (Left Box) -->
  <rect x="24" y="352" width="276" height="134" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <rect x="24" y="352" width="276" height="30" rx="6" fill="#0F172A" />
  <text x="162" y="372" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION A — Async Filter Hold</text>
  <text x="36" y="398" fill="#0284C7" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Send Polite Async Filter Reply:</text>
  <text x="36" y="420" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">1. Hold calendar booking link</text>
  <text x="36" y="442" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">2. Share 1-Page Tear-Sheet prices</text>
  <text x="36" y="464" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">3. Require 4 intake answers first</text>

  <!-- ACTION B (Middle Box) -->
  <rect x="332" y="352" width="296" height="134" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
  <rect x="332" y="352" width="296" height="30" rx="6" fill="#0284C7" />
  <text x="480" y="372" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION B — Graceful Decline / Audit</text>
  <text x="346" y="398" fill="#0F172A" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Protect Unpaid Call &amp; Proposal Time:</text>
  <text x="346" y="420" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">1. Decline gracefully via referral script</text>
  <text x="346" y="442" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">2. Or offer Paid Tier 1 Audit only</text>
  <text x="346" y="464" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">3. Save 2+ hours of unpaid custom work</text>

  <!-- ACTION C (Right Box) -->
  <rect x="652" y="352" width="284" height="134" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" />
  <rect x="652" y="352" width="284" height="30" rx="6" fill="#0D9488" />
  <text x="794" y="372" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION C — 15-Min Proposal Dispatch</text>
  <text x="664" y="398" fill="#0D9488" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Send 1-Page B.R.I.E.F. 3-Tier Proposal:</text>
  <text x="664" y="420" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">1. Dispatch within 15 mins of call end</text>
  <text x="664" y="442" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">2. Lock 7-day proposal validity window</text>
  <text x="664" y="464" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">3. Trigger 48h/5d/10d Follow-Up (Prompt 3.5)</text>

  <!-- Bottom Banner -->
  <rect x="20" y="502" width="920" height="42" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" />
  <text x="480" y="528" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">TRIAGE RULE: Never book a live discovery call or write a proposal until Gate 1 (4 Intake Answers) and Gate 2 (Budget Floor) pass.</text>
</svg>
