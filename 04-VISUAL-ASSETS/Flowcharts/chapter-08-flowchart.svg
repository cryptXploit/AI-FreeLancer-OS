<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%" style="font-family: 'Inter', Arial, sans-serif; background-color: #F8FAFC;">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A"/>
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="960" height="64" fill="#0F172A"/>
  <text x="480" y="28" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">CHAPTER 8 DECISION FLOWCHART: UNSCHEDULED CALL DEFLECTION &amp; FEEDBACK TRIAGE</text>
  <text x="480" y="48" text-anchor="middle" fill="#94A3B8" font-size="11.5" font-weight="500" style="font-family: 'Inter', Arial, sans-serif;">Deterministic Routing for Every Client Call Request, Subjective Critique, or Deliverable Review Thread</text>

  <!-- Start Node -->
  <rect x="50" y="84" width="420" height="48" rx="24" fill="#0F172A" stroke="#0284C7" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="260" y="104" text-anchor="middle" fill="#0284C7" font-size="9.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">INCOMING CLIENT COMMUNICATION</text>
  <text x="260" y="121" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">CLIENT REQUESTS UNSCHEDULED CALL OR SENDS VAGUE FEEDBACK</text>

  <!-- Arrow Start -> Gate 1 -->
  <line x1="260" y1="132" x2="260" y2="162" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow-navy)"/>

  <!-- Gate 1 Box -->
  <rect x="50" y="165" width="420" height="96" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="165" width="130" height="24" rx="6" fill="#0284C7"/>
  <text x="115" y="181" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 1: CALL TRIAGE</text>
  <text x="260" y="206" text-anchor="middle" fill="#0F172A" font-size="12.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Unscheduled Call Request Without Agenda?</text>
  <text x="260" y="226" text-anchor="middle" fill="#1E293B" font-size="10.5" style="font-family: 'Inter', Arial, sans-serif;">Did the client ask to "hop on a quick call" without a written</text>
  <text x="260" y="243" text-anchor="middle" fill="#1E293B" font-size="10.5" style="font-family: 'Inter', Arial, sans-serif;">agenda or a genuine production-stopping blocker?</text>

  <!-- Arrow Gate 1 -> Action A (YES) -->
  <line x1="470" y1="213" x2="545" y2="213" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <rect x="480" y="192" width="54" height="18" rx="4" fill="#F0F9FF"/>
  <text x="507" y="205" text-anchor="middle" fill="#0284C7" font-size="9.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (CALL)</text>

  <!-- Action A Box -->
  <rect x="550" y="155" width="380" height="116" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="550" y="155" width="380" height="26" rx="8" fill="#0284C7"/>
  <text x="564" y="172" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION A: RUN PROMPT 8.5 (ASYNC CALL REDIRECTOR)</text>
  <text x="564" y="196" fill="#0F172A" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Protect Morning Deep-Work Maker Block:</text>
  <text x="564" y="215" fill="#1E293B" font-size="10" style="font-family: 'Inter', Arial, sans-serif;">• State you are heads-down in their production sprint right now</text>
  <text x="564" y="232" fill="#1E293B" font-size="10" style="font-family: 'Inter', Arial, sans-serif;">• Offer immediate async resolution today if they reply with 2 bullets</text>
  <text x="564" y="249" fill="#1E293B" font-size="10" style="font-family: 'Inter', Arial, sans-serif;">• Or offer a 15-min slot in tomorrow's afternoon office-hours window</text>

  <!-- Arrow Gate 1 -> Gate 2 (NO) -->
  <line x1="260" y1="261" x2="260" y2="300" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="270" y="272" width="110" height="18" rx="4" fill="#F0FDFA"/>
  <text x="325" y="285" text-anchor="middle" fill="#0D9488" font-size="9.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (DELIVERABLE NOTE)</text>

  <!-- Gate 2 Box -->
  <rect x="50" y="304" width="420" height="96" rx="10" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="50" y="304" width="150" height="24" rx="6" fill="#0F172A"/>
  <text x="125" y="320" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 2: CLARITY CHECK</text>
  <text x="260" y="345" text-anchor="middle" fill="#0F172A" font-size="12.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Is Feedback Vague or Subjective?</text>
  <text x="260" y="365" text-anchor="middle" fill="#1E293B" font-size="10.5" style="font-family: 'Inter', Arial, sans-serif;">Does the client say "make it pop" or "doesn't feel right" instead</text>
  <text x="260" y="382" text-anchor="middle" fill="#1E293B" font-size="10.5" style="font-family: 'Inter', Arial, sans-serif;">of citing concrete B.R.I.E.F. or Kickoff Brief goals?</text>

  <!-- Arrow Gate 2 -> Action B (YES) -->
  <line x1="470" y1="352" x2="545" y2="352" stroke="#0284C7" stroke-width="2.5" marker-end="url(#arrow-sky)"/>
  <rect x="480" y="331" width="58" height="18" rx="4" fill="#F0F9FF"/>
  <text x="509" y="344" text-anchor="middle" fill="#0284C7" font-size="9.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (VAGUE)</text>

  <!-- Action B Box -->
  <rect x="550" y="294" width="380" height="116" rx="10" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" filter="url(#shadow)"/>
  <rect x="550" y="294" width="380" height="26" rx="8" fill="#0F172A"/>
  <text x="564" y="311" fill="#FFFFFF" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION B: RUN PROMPT 8.3 (GUIDED FEEDBACK REFRAMER)</text>
  <text x="564" y="335" fill="#0F172A" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Never Guess or Blindly Redo Work:</text>
  <text x="564" y="354" fill="#1E293B" font-size="10" style="font-family: 'Inter', Arial, sans-serif;">• Translate vague reactions into 3 diagnostic commercial options</text>
  <text x="564" y="371" fill="#1E293B" font-size="10" style="font-family: 'Inter', Arial, sans-serif;">• Anchor each option to their target buyer's conversion goal</text>
  <text x="564" y="388" fill="#1E293B" font-size="10" style="font-family: 'Inter', Arial, sans-serif;">• Hold Revision Round execution until client selects exact spec</text>

  <!-- Arrow Gate 2 -> Action C (NO) -->
  <line x1="260" y1="400" x2="260" y2="438" stroke="#0D9488" stroke-width="2.5" marker-end="url(#arrow-teal)"/>
  <rect x="270" y="410" width="95" height="18" rx="4" fill="#F0FDFA"/>
  <text x="317" y="423" text-anchor="middle" fill="#0D9488" font-size="9.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (ACTIONABLE)</text>

  <!-- Final Action C Box -->
  <rect x="50" y="442" width="880" height="96" rx="12" fill="#0F172A" stroke="#0D9488" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="70" y="456" width="240" height="22" rx="11" fill="#0D9488"/>
  <text x="190" y="471" text-anchor="middle" fill="#FFFFFF" font-size="9.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION C: BATCHED REVISION &amp; WALKTHROUGH</text>
  <text x="70" y="496" fill="#FFFFFF" font-size="13" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">LOG IN REVISION TRACKER (PROMPT 8.4), EXECUTE IN AFTERNOON BLOCK &amp; SHIP WITH WALKTHROUGH (PROMPT 8.2)</text>
  <text x="70" y="517" fill="#94A3B8" font-size="10.5" font-weight="500" style="font-family: 'Inter', Arial, sans-serif;">Update Header ("Revision Round 1 of 2 Complete") + Attach Itemized Change Log + Include 3-Min Async Walkthrough Video + Request Final Phase Sign-Off</text>
</svg>
