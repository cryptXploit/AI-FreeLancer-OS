<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="font-family: 'Inter', Arial, sans-serif; background-color: #F8FAFC;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrow-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A"/>
    </marker>
  </defs>

  <!-- Header Banner -->
  <rect x="0" y="0" width="1200" height="80" fill="#0F172A"/>
  <text x="600" y="34" text-anchor="middle" fill="#F8FAFC" font-size="19" font-weight="800" letter-spacing="1.1">CHAPTER 7 DECISION FLOWCHART: IN-SCOPE REVISION VS. PAID CHANGE ORDER TRIAGE</text>
  <text x="600" y="58" text-anchor="middle" fill="#94A3B8" font-size="13" font-weight="500">Deterministic Boundary Routing for Every Client Edit Request, Feature Addition, or Stakeholder Comment</text>

  <!-- Start Node -->
  <rect x="90" y="102" width="480" height="60" rx="30" fill="#0F172A" stroke="#10B981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="330" y="128" text-anchor="middle" fill="#10B981" font-size="11" font-weight="800" letter-spacing="0.8">INCOMING CLIENT REQUEST</text>
  <text x="330" y="147" text-anchor="middle" fill="#F8FAFC" font-size="13" font-weight="700">CLIENT SENDS EDIT REQUEST OR "CAN YOU QUICKLY ADD THIS?"</text>

  <!-- Arrow Start -> Gate 1 -->
  <line x1="330" y1="162" x2="330" y2="202" stroke="#0F172A" stroke-width="2.5" marker-end="url(#arrow-navy)"/>

  <!-- Gate 1 Box -->
  <rect x="90" y="205" width="480" height="125" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="90" y="205" width="130" height="28" rx="6" fill="#0F172A"/>
  <text x="155" y="223" text-anchor="middle" fill="#F59E0B" font-size="11" font-weight="800">GATE 1: SOW AUDIT</text>
  <text x="330" y="252" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="800">Contractual Scope &amp; Revision Counter Check</text>
  <text x="330" y="276" text-anchor="middle" fill="#334155" font-size="12">1. Is this item explicitly included in the signed SOW &amp; Kickoff Brief?</text>
  <text x="330" y="296" text-anchor="middle" fill="#334155" font-size="12">2. Is the client within their contracted Revision Round Allowance (e.g., ≤ 2)?</text>
  <text x="330" y="316" text-anchor="middle" fill="#64748B" font-size="11" font-style="italic">(Run Prompt 7.1 Scope Diagnostic if borderline or ambiguous)</text>

  <!-- Arrow Gate 1 -> Action C (NO / OUT OF SCOPE) -->
  <line x1="570" y1="268" x2="680" y2="268" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <rect x="585" y="244" width="82" height="20" rx="4" fill="#FEF3C7"/>
  <text x="626" y="258" text-anchor="middle" fill="#B45309" font-size="10.5" font-weight="800">NO (OUT OF SCOPE)</text>

  <!-- Action C Box (Top-Right: P.V.P. Protocol) -->
  <rect x="685" y="185" width="465" height="175" rx="12" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="685" y="185" width="465" height="34" rx="10" fill="#F59E0B"/>
  <text x="705" y="207" fill="#0F172A" font-size="12" font-weight="800">ACTION C: TRIGGER P.V.P. CHANGE ORDER PROTOCOL</text>
  <text x="705" y="240" fill="#0F172A" font-size="13" font-weight="700">Deploy Prompts 7.1 + 7.2 (Never Work Unbilled):</text>
  <text x="705" y="263" fill="#334155" font-size="12">• Pause &amp; validate enthusiasm for the business idea</text>
  <text x="705" y="283" fill="#334155" font-size="12">• Present Option A: Paid Change Order ($ Fee + +X Days)</text>
  <text x="705" y="303" fill="#334155" font-size="12">• Present Option B: Swap equal-effort item from current SOW</text>
  <text x="705" y="323" fill="#334155" font-size="12">• Present Option C: Park in Phase 2 Backlog to protect launch</text>
  <text x="705" y="346" fill="#B45309" font-size="11" font-weight="700">Wait for written selection &amp; payment before executing</text>

  <!-- Arrow Gate 1 -> Gate 2 (YES / IN SCOPE) -->
  <line x1="330" y1="330" x2="330" y2="395" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-emerald)"/>
  <rect x="342" y="352" width="90" height="20" rx="4" fill="#D1FAE5"/>
  <text x="387" y="366" text-anchor="middle" fill="#065F46" font-size="10.5" font-weight="800">YES (IN SCOPE)</text>

  <!-- Gate 2 Box -->
  <rect x="90" y="398" width="480" height="125" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="90" y="398" width="150" height="28" rx="6" fill="#0F172A"/>
  <text x="165" y="416" text-anchor="middle" fill="#10B981" font-size="11" font-weight="800">GATE 2: SPOC CHECK</text>
  <text x="330" y="445" text-anchor="middle" fill="#0F172A" font-size="15" font-weight="800">Consolidated Feedback &amp; Conflict Check</text>
  <text x="330" y="469" text-anchor="middle" fill="#334155" font-size="12">1. Did all stakeholders submit feedback in ONE consolidated batch?</text>
  <text x="330" y="489" text-anchor="middle" fill="#334155" font-size="12">2. Is the batch free of contradictory instructions between executives?</text>
  <text x="330" y="509" fill="#64748B" font-size="11" font-style="italic">(Run Prompt 7.3 to audit multi-stakeholder comment threads)</text>

  <!-- Arrow Gate 2 -> Action A (NO / FRAGMENTED OR CONFLICTING) -->
  <line x1="570" y1="460" x2="680" y2="460" stroke="#F59E0B" stroke-width="3" marker-end="url(#arrow-amber)"/>
  <rect x="585" y="436" width="82" height="20" rx="4" fill="#FEF3C7"/>
  <text x="626" y="450" text-anchor="middle" fill="#B45309" font-size="10.5" font-weight="800">NO (CONFLICT)</text>

  <!-- Action A Box (Bottom-Right: Prompt 7.4 Consolidation Redirect) -->
  <rect x="685" y="395" width="465" height="145" rx="12" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5" filter="url(#shadow)"/>
  <rect x="685" y="395" width="465" height="34" rx="10" fill="#0F172A"/>
  <text x="705" y="417" fill="#F59E0B" font-size="12" font-weight="800">ACTION A: HOLD REVISION &amp; REQUEST SPOC SIGN-OFF</text>
  <text x="705" y="450" fill="#0F172A" font-size="13" font-weight="700">Send Prompt 7.4 (Diplomatic Tie-Breaker Script):</text>
  <text x="705" y="472" fill="#334155" font-size="12">• Present synthesized table of conflicting stakeholder notes</text>
  <text x="705" y="492" fill="#334155" font-size="12">• Ask Single Point of Contact (SPOC) to make the final call</text>
  <text x="705" y="512" fill="#334155" font-size="12">• Protect client's Revision Round Counter until unified</text>

  <!-- Arrow Gate 2 -> Action B (YES / UNIFIED & IN-SCOPE) -->
  <line x1="330" y1="523" x2="330" y2="590" stroke="#10B981" stroke-width="3" marker-end="url(#arrow-emerald)"/>
  <rect x="342" y="545" width="90" height="20" rx="4" fill="#D1FAE5"/>
  <text x="387" y="559" text-anchor="middle" fill="#065F46" font-size="10.5" font-weight="800">YES (UNIFIED)</text>

  <!-- Final Action B Box -->
  <rect x="90" y="595" width="1060" height="145" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="3" filter="url(#shadow)"/>
  <rect x="115" y="615" width="250" height="26" rx="13" fill="#10B981"/>
  <text x="240" y="633" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="800" letter-spacing="0.8">AUTHORIZED IN-SCOPE EXECUTION</text>
  <text x="115" y="666" fill="#F8FAFC" font-size="16" font-weight="800">ACTION B: EXECUTE IN-SCOPE REVISION ROUND [N OF M] &amp; LOG IN CLIENT PORTAL</text>
  <text x="115" y="692" fill="#94A3B8" font-size="13" font-weight="500">1. Batch-execute all unified edits in a single sprint  |  2. Update Revision Counter in Notion Portal (e.g., "Round 1 of 2 Complete")</text>
  <text x="115" y="714" fill="#10B981" font-size="12.5" font-weight="700">3. Return updated deliverable with Change-Log Checklist + Final Milestone Sign-Off &amp; Invoice Trigger</text>
</svg>
