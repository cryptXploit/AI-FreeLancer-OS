<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <marker id="ch5-fc-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="ch5-fc-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0284C7" />
    </marker>
    <marker id="ch5-fc-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#0D9488" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" rx="8" />

  <!-- Top Header Banner -->
  <rect x="20" y="14" width="920" height="42" rx="6" fill="#0F172A" />
  <text x="480" y="40" text-anchor="middle" fill="#FFFFFF" font-size="14.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">CHAPTER 5 DECISION FLOWCHART: PRE-FLIGHT ASSET GATE &amp; TIMELINE PAUSE PROTOCOL</text>

  <!-- Start Node -->
  <rect x="280" y="68" width="400" height="42" rx="21" fill="#0F172A" stroke="#0284C7" stroke-width="2" />
  <text x="480" y="94" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">CONTRACT SIGNED &amp; DEPOSIT INVOICE PAID</text>
  <path d="M 480 110 L 480 138" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch5-fc-navy)" />

  <!-- Gate 1 -->
  <rect x="190" y="140" width="580" height="54" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
  <text x="480" y="162" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 1: THE 48-HOUR 100% PRE-FLIGHT ASSET GATE</text>
  <text x="480" y="182" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Did the client submit 100% of required Pre-Flight Intake Assets &amp; Logins within 48 hours?</text>

  <!-- Gate 1 NO -> Action A (Left) -->
  <path d="M 190 167 L 155 167 L 155 328" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch5-fc-navy)" />
  <rect x="48" y="214" width="214" height="24" rx="4" fill="#0F172A" />
  <text x="155" y="230" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (Missing Files / Partial Inputs)</text>

  <!-- Gate 1 YES -> Gate 2 -->
  <path d="M 575 194 L 620 226" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch5-fc-teal)" />
  <rect x="595" y="198" width="175" height="22" rx="4" fill="#0D9488" />
  <text x="682" y="213" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (100% Assets Verified)</text>

  <!-- Gate 2 -->
  <rect x="340" y="228" width="580" height="54" rx="8" fill="#0284C7" stroke="#0F172A" stroke-width="1.5" />
  <text x="630" y="250" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">GATE 2: SINGLE POINT-OF-CONTACT (SPOC) AUTHORITY CHECK</text>
  <text x="630" y="270" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Is there a single designated decision-maker with final sign-off authority?</text>

  <!-- Gate 2 NO -> Action B (Middle) -->
  <path d="M 485 282 L 480 328" stroke="#0F172A" stroke-width="2.5" fill="none" marker-end="url(#ch5-fc-navy)" />
  <rect x="370" y="293" width="210" height="22" rx="4" fill="#0F172A" />
  <text x="475" y="308" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">NO (Multiple Unaligned Reviewers)</text>

  <!-- Gate 2 YES -> Action C (Right) -->
  <path d="M 785 282 L 795 328" stroke="#0D9488" stroke-width="2.5" fill="none" marker-end="url(#ch5-fc-teal)" />
  <rect x="712" y="293" width="166" height="22" rx="4" fill="#0D9488" />
  <text x="795" y="308" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">YES (SPOC Confirmed)</text>

  <!-- ACTION A (Left Box) -->
  <rect x="24" y="332" width="284" height="150" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="2" />
  <rect x="24" y="332" width="284" height="30" rx="6" fill="#0F172A" />
  <text x="166" y="352" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION A — Hold &amp; Shift Timeline</text>
  <text x="36" y="378" fill="#0284C7" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Trigger Prompt 5.5 Circuit Breaker:</text>
  <text x="36" y="400" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">1. Hold live Kickoff Call booking</text>
  <text x="36" y="422" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">2. Send "Missing Assets = Shifted Date"</text>
  <text x="36" y="444" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">3. Do NOT start sprint with partial files</text>
  <text x="36" y="466" fill="#0F172A" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Rule: Day-for-Day Delivery Shift</text>

  <!-- ACTION B (Middle Box) -->
  <rect x="332" y="332" width="296" height="150" rx="8" fill="#F0F9FF" stroke="#0284C7" stroke-width="2" />
  <rect x="332" y="332" width="296" height="30" rx="6" fill="#0284C7" />
  <text x="480" y="352" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION B — Enforce SPOC Charter</text>
  <text x="346" y="378" fill="#0284C7" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Lock Single Point-of-Contact Rule:</text>
  <text x="346" y="400" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">1. Issue Welcome Charter (Prompt 5.2)</text>
  <text x="346" y="422" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">2. Require 1 SPOC to consolidate edits</text>
  <text x="346" y="444" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">3. Map stakeholder role matrix first</text>
  <text x="346" y="466" fill="#0F172A" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Rule: Zero Split-Thread Feedback</text>

  <!-- ACTION C (Right Box) -->
  <rect x="652" y="332" width="284" height="150" rx="8" fill="#F0FDFA" stroke="#0D9488" stroke-width="2" />
  <rect x="652" y="332" width="284" height="30" rx="6" fill="#0D9488" />
  <text x="794" y="352" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ACTION C — Execute 30-Min Kickoff</text>
  <text x="664" y="378" fill="#0D9488" font-size="10.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Launch Production Sprint 1:</text>
  <text x="664" y="400" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">1. Run 30-Min Alignment Call (Prompt 5.3)</text>
  <text x="664" y="422" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">2. Send Milestone Lock Memo in 2h (5.4)</text>
  <text x="664" y="444" fill="#1E293B" font-size="10" font-weight="600" style="font-family: 'Inter', Arial, sans-serif;">3. Start Production Maker Block 1</text>
  <text x="664" y="466" fill="#0D9488" font-size="10" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">Result: Zero-Friction Sprint Velocity</text>

  <!-- Bottom Banner -->
  <rect x="20" y="500" width="920" height="44" rx="6" fill="#0F172A" stroke="#0284C7" stroke-width="1.5" />
  <text x="480" y="527" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="700" style="font-family: 'Inter', Arial, sans-serif;">ONBOARDING CIRCUIT BREAKER: The delivery clock starts when 100% of assets are verified in the vault—never when the contract is signed.</text>
</svg>
