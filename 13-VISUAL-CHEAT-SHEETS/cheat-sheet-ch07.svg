  <text x="72" y="118" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" fill="#FFFFFF">Ch 07: Defeating Scope Creep &amp; Difficult Client Conversations</text>
  <text x="72" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#CBD5E1">Converting &#x27;Quick Favors&#x27; Into Paid Change Orders via P.V.P. &amp; Enforcing Late-Payment Escalation</text>

  <!-- PANEL 1 (TOP-LEFT): 60-SECOND EXECUTIVE TL;DR -->
