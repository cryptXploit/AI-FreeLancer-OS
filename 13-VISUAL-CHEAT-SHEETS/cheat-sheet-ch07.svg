  <text x="72" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#38BDF8" letter-spacing="1.5">CHAPTER 07 VISUAL CHEAT SHEET // PART III: ONBOARDING, EXECUTION &amp; SCOPE</text>
  <rect x="880" y="48" width="252" height="36" rx="8" fill="#0D9488"/>
