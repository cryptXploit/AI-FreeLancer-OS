  <text x="634" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#2DD4BF">PAUSE • VALIDATE • PRICE (P.V.P.) CHANGE ORDER FORMULA</text>
