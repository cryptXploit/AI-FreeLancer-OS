  <text x="68" y="236" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#FFFFFF">PANEL 01 // THE 60-SECOND EXECUTIVE TL;DR</text>

  <text x="68" y="288" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">1. Scope creep rarely arrives as a giant demand; it arrives as ten &#x27;</text>
  <text x="68" y="310" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">Hey, quick 10-minute favor?&#x27; messages.</text>

  <text x="68" y="366" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">2. Never say &#x27;No&#x27; and never work for free—use Pause, Validate, Price</text>
  <text x="68" y="388" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8"> (P.V.P.) to issue a 1-page Change Order.</text>

  <text x="68" y="444" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">3. Enforce the deterministic Day +3, Day +7 (Work Pause), and Day +1</text>
  <text x="68" y="466" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">4 Late-Payment Escalation Ladder.</text>

  <rect x="68" y="488" width="498" height="32" rx="6" fill="#1E293B"/>
  <text x="317" y="509" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="700" fill="#38BDF8" text-anchor="middle">GATE 04: P.V.P. SCOPE &amp; PAYMENT DEFENSE</text>

