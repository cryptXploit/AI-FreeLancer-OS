  <!-- TOP HEADER BAR -->
  <rect x="44" y="34" width="1112" height="148" rx="16" fill="#1E293B" stroke="#0284C7" stroke-width="2.5"/>
  <text x="72" y="72" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#38BDF8" letter-spacing="1.5">CHAPTER 03 VISUAL CHEAT SHEET // PART II: PIPELINE TRIAGE &amp; PROPOSALS</text>
  <rect x="880" y="48" width="252" height="36" rx="8" fill="#0D9488"/>
  <text x="1006" y="71" font-family="JetBrains Mono, Consolas, monospace" font-size="13.5" font-weight="800" fill="#FFFFFF" text-anchor="middle">10 MINS PER LEAD</text>

  <text x="72" y="118" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="900" fill="#FFFFFF">Ch 03: The 10-Minute Lead Triage &amp; Proposal Engine</text>
  <text x="72" y="154" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" fill="#CBD5E1">Scoring Inbound Inquiries via P.A.C.E. &amp; Generating 3-Option B.R.I.E.F. Proposals in 10 Minutes</text>

  <!-- PANEL 1 (TOP-LEFT): 60-SECOND EXECUTIVE TL;DR -->
  <rect x="44" y="206" width="546" height="330" rx="16" fill="#0F172A" stroke="#0284C7" stroke-width="2"/>
  <rect x="44" y="206" width="546" height="48" rx="16" fill="#0284C7"/>
  <text x="68" y="236" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#FFFFFF">PANEL 01 // THE 60-SECOND EXECUTIVE TL;DR</text>

  <text x="68" y="288" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">1. Never hop on a 45-minute discovery call before an inquiry passes </text>
  <text x="68" y="310" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">the 20-point P.A.C.E. Lead Filter.</text>

  <text x="68" y="366" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">2. Route low-fit leads (&lt;10 pts) to a polite decline and medium lead</text>
  <text x="68" y="388" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">s (10-13 pts) to a Paid Diagnostic.</text>

  <text x="68" y="444" font-family="Inter, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#F8FAFC">3. Draft complete 3-Tier B.R.I.E.F. proposals in under 10 minutes us</text>
  <text x="68" y="466" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="500" fill="#94A3B8">ing your discovery notes and Prompt 3.3.</text>

  <rect x="68" y="488" width="498" height="32" rx="6" fill="#1E293B"/>
  <text x="317" y="509" font-family="JetBrains Mono, Consolas, monospace" font-size="12.5" font-weight="700" fill="#38BDF8" text-anchor="middle">GATE 01 &amp; 02: TRIAGE &amp; RAPID PROPOSALS</text>

  <!-- PANEL 2 (TOP-RIGHT): CORE NAMED FRAMEWORK & FORMULA -->
  <rect x="610" y="206" width="546" height="330" rx="16" fill="#0F172A" stroke="#0D9488" stroke-width="2"/>
  <rect x="610" y="206" width="546" height="48" rx="16" fill="#0D9488"/>
  <text x="634" y="236" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#FFFFFF">PANEL 02 // CORE NAMED FRAMEWORK &amp; EQUATION</text>

  <text x="634" y="292" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="800" fill="#2DD4BF">20-POINT P.A.C.E. LEAD QUALIFICATION SCORER</text>
  <rect x="634" y="312" width="498" height="104" rx="12" fill="#1E293B" stroke="#2DD4BF" stroke-width="2"/>
  <text x="883" y="356" font-family="JetBrains Mono, Consolas, monospace" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">P.A.C.E. Score (0-20) = Problem (0-5) + Authority (0-5) </text>
  <text x="883" y="386" font-family="JetBrains Mono, Consolas, monospace" font-size="13.5" font-weight="700" fill="#38BDF8" text-anchor="middle">+ Commercial Fit (0-5) + Execution (0-5)</text>

  <text x="634" y="452" font-family="Inter, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#E2E8F0">OPERATIONAL BENCHMARK RULE:</text>
  <text x="634" y="478" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">Routing Thresholds: 14-20 Pts = Full 3-Tier Proposal | 10-13 Pts = Paid Audit | &lt;10 Pts = Decline</text>
  <text x="634" y="512" font-family="JetBrains Mono, Consolas, monospace" font-size="12" font-weight="700" fill="#FBBF24">SYNCED WORKBOOK: Worksheet 3.1 (US Letter, A4, Word &amp; Web App)</text>

